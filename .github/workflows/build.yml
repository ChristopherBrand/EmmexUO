name: build

on: [push, pull_request]

jobs:
  MacOS:
    # macos-15 runners are Apple Silicon; builds a native arm64 EmmexUO.app
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # make_app.sh uses `git describe` for the bundle version
    - name: tools
      run: brew install ninja
    - name: configure
      run: cmake -B build -S . -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: cmake --build build
    - name: bundle
      run: |
        tools/macos/make_app.sh build build/dist
        ditto -c -k --keepParent build/dist/EmmexUO.app emmexuo-macos-arm64.zip
    - uses: actions/upload-artifact@v4
      with:
        name: emmexuo-macos-arm64
        path: emmexuo-macos-arm64.zip
    - name: release tag
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: emmexuo-macos-arm64.zip
